name: Secrets

# Runs on every push and pull request, plus once a week: a key committed months
# ago is still a leak even if nobody touches the repository, and the gitleaks
# rule set keeps improving, so a re-scan can find what an older version missed.
on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 4 * * 1'

permissions:
  contents: read

concurrency:
  group: secrets-${{ github.ref }}
  cancel-in-progress: true

env:
  GITLEAKS_VERSION: 8.30.1

jobs:
  gitleaks:
    name: gitleaks (history + working tree)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          set -euo pipefail
          url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL "$url" -o /tmp/gitleaks.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo install -m 0755 /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      # --redact is mandatory: without it a detected secret would be written
      # into the CI log, turning a caught leak into a published one.
      - name: Scan the entire commit history
        run: gitleaks git . --verbose --redact --exit-code 1

      - name: Scan the working tree
        run: gitleaks dir . --verbose --redact --exit-code 1

  policy:
    name: repository policy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # conf.txt, the isolated Cline profile and logs must stay untracked, the
      # .gitignore rules must still be live, and no credential shape may appear
      # in tracked files. Runs locally too: bash scripts/check-repo-policy.sh
      - name: Check repository policy
        run: bash scripts/check-repo-policy.sh
